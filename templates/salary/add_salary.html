{% extends "base/base.html" %}

{% block title %}Add Salary{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2>💰 Add Staff Salary</h2>
        <p class="text-muted mb-0">Record monthly or daily employee salary</p>
    </div>

    <a href="{% url 'salary_list' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Salary History
    </a>
</div>


<form method="POST">

    {% csrf_token %}

    <div class="row">

        <!-- Employee Details -->
        <div class="col-md-6 mb-4">

            <div class="card shadow h-100">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">👤 Employee Details</h5>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">
                            Employee <span class="text-danger">*</span>
                        </label>

                        <select name="employee"
                                id="employee"
                                class="form-select"
                                required>

                            <option value="">Select Employee</option>

                            {% for employee in employees %}
                                <option value="{{ employee.id }}">
                                    {{ employee.first_name }}
                                    {{ employee.last_name }}
                                    - {{ employee.employee_id }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Salary Month <span class="text-danger">*</span>
                        </label>

                        <input type="date"
                               name="salary_month"
                               class="form-control"
                               required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Salary Type</label>

                        <select name="salary_type"
                                class="form-select">

                            <option value="Monthly">
                                Monthly
                            </option>

                            <option value="Daily">
                                Daily
                            </option>

                        </select>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Basic Salary
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">₹</span>

                            <input type="number"
                                   name="basic_salary"
                                   class="form-control"
                                   step="0.01"
                                   min="0"
                                   value="0">
                        </div>
                    </div>

                </div>

            </div>

        </div>


        <!-- Attendance -->
        <div class="col-md-6 mb-4">

            <div class="card shadow h-100">

                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">📅 Attendance</h5>
                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Working Days
                            </label>

                            <input type="number"
                                   name="working_days"
                                   class="form-control"
                                   min="0"
                                   value="0">

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Present Days
                            </label>

                            <input type="number"
                                   name="present_days"
                                   class="form-control"
                                   min="0"
                                   value="0">

                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Overtime Hours
                        </label>

                        <input type="number"
                               name="overtime_hours"
                               class="form-control"
                               step="0.5"
                               min="0"
                               value="0">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Overtime Amount
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">₹</span>

                            <input type="number"
                                   name="overtime_amount"
                                   class="form-control"
                                   step="0.01"
                                   min="0"
                                   value="0">

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Deductions -->
        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-header bg-warning">
                    <h5 class="mb-0">💸 Advance & Deduction</h5>
                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Advance
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">₹</span>

                            <input type="number"
                                   name="advance"
                                   class="form-control"
                                   step="0.01"
                                   min="0"
                                   value="0">

                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Deduction
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">₹</span>

                            <input type="number"
                                   name="deduction"
                                   class="form-control"
                                   step="0.01"
                                   min="0"
                                   value="0">

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Payment -->
        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">💳 Payment</h5>
                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Payment Status
                        </label>

                        <select name="payment_status"
                                class="form-select">

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="Paid">
                                Paid
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Payment Date
                        </label>

                        <input type="date"
                               name="payment_date"
                               class="form-control">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Payment Method
                        </label>

                        <select name="payment_method"
                                class="form-select">

                            <option value="Cash">
                                Cash
                            </option>

                            <option value="Bank">
                                Bank
                            </option>

                            <option value="UPI">
                                UPI
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>


        <!-- Notes -->
        <div class="col-12 mb-4">

            <div class="card shadow">

                <div class="card-header">
                    <h5 class="mb-0">📝 Notes</h5>
                </div>

                <div class="card-body">

                    <textarea name="notes"
                              class="form-control"
                              rows="3"
                              placeholder="Any additional notes..."></textarea>

                </div>

            </div>

        </div>


        <!-- Buttons -->
        <div class="col-12">

            <div class="d-flex gap-2">

                <button type="submit"
                        class="btn btn-success btn-lg">

                    <i class="bi bi-check-circle"></i>
                    Save Salary

                </button>


                <a href="{% url 'salary_list' %}"
                   class="btn btn-secondary btn-lg">

                    Cancel

                </a>

            </div>

        </div>

    </div>

</form>

{% endblock %}

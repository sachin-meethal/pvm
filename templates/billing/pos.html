{% extends "base/base.html" %}

{% block title %}POS Billing{% endblock %}

{% block content %}

<div class="row">

    <!-- Left Side -->
    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🍽 Menu</h4>
            </div>

            <div class="card-body">

                <div class="row">

                    {% for item in items %}

                    <div class="col-md-4 mb-3">

                        <div class="card h-100 shadow-sm">

                            <div class="card-body text-center">

                                <h5>{{ item.name }}</h5>

                                <h4 class="text-success">₹{{ item.price }}</h4>

                                <button class="btn btn-primary w-100"
                                    onclick="addItem({{ item.id }}, '{{ item.name|escapejs }}', {{ item.price }})">
                                    Add
                                </button>

                            </div>

                        </div>

                    </div>

                    {% empty %}

                    <div class="col-12">
                        <div class="alert alert-warning text-center">
                            No menu items found.
                        </div>
                    </div>

                    {% endfor %}

                </div>

            </div>

        </div>

    </div>

    <!-- Right Side -->

    <div class="col-md-4">

        <div class="card shadow">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">🧾 Current Bill</h4>
            </div>

            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text" class="form-control" id="customer-name" placeholder="Walk-in Customer">
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment</label>

                    <select id="payment-method" class="form-select">
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="UPI">UPI</option>
                    </select>
                </div>

                <div id="cart-items">
                    <p class="text-muted">No items selected.</p>
                </div>

                <hr>

                <h4>
                    Total :
                    <span id="cart-total">₹0</span>
                </h4>

                <button class="btn btn-success w-100 mt-3" onclick="saveBill()">
                    Save Bill
                </button>

            </div>

        </div>

    </div>

</div>


{% endblock %}

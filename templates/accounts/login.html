<!DOCTYPE html>
<html>
<head>
    <title>PVM Restaurant Login</title>
</head>
<body>

<h2>PVM Restaurant ERP</h2>

<form method="POST">
    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
    ><br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
    ><br><br>

    <button type="submit">
        Login
    </button>

</form>

{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}

</body>
</html>

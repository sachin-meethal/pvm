<aside class="pvm-sidebar">

    <!-- LOGO -->
    <div class="pvm-logo-area">

        <div class="pvm-logo">
            <i class="bi bi-shop"></i>
        </div>

        <div class="pvm-logo-text">
            <div>PVM</div>
            <small>Restaurant ERP</small>
        </div>

    </div>


    <!-- MENU -->
    <nav class="pvm-menu">

        <div class="pvm-menu-title">
            MENU
        </div>


        <a href="/"
           class="pvm-menu-item {% if request.path == '/' %}active{% endif %}">

            <i class="bi bi-grid"></i>
            <span>Dashboard</span>

        </a>


        <a href="/billing/"
           class="pvm-menu-item {% if request.path == '/billing/' %}active{% endif %}">

            <i class="bi bi-receipt"></i>
            <span>POS Billing</span>

        </a>


        <a href="/employees/"
           class="pvm-menu-item {% if '/employees/' in request.path %}active{% endif %}">

            <i class="bi bi-people"></i>
            <span>Employees</span>

        </a>


        <a href="#"
           class="pvm-menu-item">

            <i class="bi bi-calendar-check"></i>
            <span>Attendance</span>

        </a>


        <a href="/salary/"
           class="pvm-menu-item {% if '/salary/' in request.path %}active{% endif %}">

            <i class="bi bi-wallet2"></i>
            <span>Salary</span>

        </a>


        <a href="#"
           class="pvm-menu-item">

            <i class="bi bi-box"></i>
            <span>Inventory</span>

        </a>


        <a href="#"
           class="pvm-menu-item">

            <i class="bi bi-cart3"></i>
            <span>Purchase</span>

        </a>


        <a href="#"
           class="pvm-menu-item">

            <i class="bi bi-bar-chart"></i>
            <span>Reports</span>

        </a>


        <a href="/billing/history/"
           class="pvm-menu-item {% if '/billing/history/' in request.path %}active{% endif %}">

            <i class="bi bi-clock-history"></i>
            <span>Bill History</span>

        </a>


        <div class="pvm-menu-title pvm-settings-title">
            SYSTEM
        </div>


        <a href="#"
           class="pvm-menu-item">

            <i class="bi bi-gear"></i>
            <span>Settings</span>

        </a>

    </nav>


    <!-- USER / RESTAURANT -->
    <div class="pvm-sidebar-bottom">

        <div class="pvm-user">

            <div class="pvm-user-icon">
                <i class="bi bi-person"></i>
            </div>

            <div class="pvm-user-info">
                <strong>PVM Restaurant</strong>
                <small>Management System</small>
            </div>

            <i class="bi bi-three-dots pvm-more"></i>

        </div>

    </div>

</aside>
